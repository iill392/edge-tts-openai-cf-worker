<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语音生成器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        h1 { font-size: 1.8rem; margin-bottom: 5px; color: #fff; }
        .sub { color: #888; margin-bottom: 25px; font-size: 0.9rem; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #aaa; font-size: 0.9rem; }
        textarea, select, input {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 18px;
            outline: none;
            transition: border 0.2s;
        }
        textarea:focus, select:focus, input:focus { border-color: #6c63ff; }
        textarea { resize: vertical; min-height: 100px; }
        button {
            width: 100%;
            padding: 14px;
            background: #6c63ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #5a52d5; }
        button:active { transform: scale(0.97); }
        button:disabled { background: #444; cursor: not-allowed; }
        .status {
            margin-top: 15px;
            padding: 12px;
            background: #2a2a2a;
            border-radius: 8px;
            font-size: 0.9rem;
            text-align: center;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error { color: #ff6b6b; }
        .success { color: #4ecdc4; }
        audio { width: 100%; margin-top: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ AI 语音生成器</h1>
        <p class="sub">输入文字，AI 帮你读出来</p>

        <label for="apikey">🔑 API Key</label>
        <input type="password" id="apikey" placeholder="请输入你设置的 API_KEY" autocomplete="off">

        <label for="voice">🗣️ 选择声音</label>
        <select id="voice">
            <option value="zh-CN-YunxiNeural" selected>云希 (男声，年轻自然)</option>
            <option value="zh-CN-YunyangNeural">云扬 (男声，新闻播报)</option>
            <option value="zh-CN-YunjianNeural">云剑 (男声，小说朗读)</option>
            <option value="zh-CN-XiaoxiaoNeural">晓晓 (女声，温柔)</option>
            <option value="zh-CN-XiaoyiNeural">晓伊 (女声，活泼)</option>
            <option value="zh-CN-YunxiaNeural">云夏 (男声，青年)</option>
            <option value="zh-CN-YunyeNeural">云野 (男声，稳重)</option>
        </select>

        <label for="text">✏️ 要合成的文字</label>
        <textarea id="text" placeholder="在这里输入你想说的话...">你好，世界！这是一个免费的AI语音合成测试。</textarea>

        <button id="speakBtn">🔊 生成并播放</button>

        <div class="status" id="status">等待输入...</div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <script>
        // 因为页面就放在 API 项目里，所以用相对路径，完美解决跨域
        const API_URL = '/v1/audio/speech';

        const speakBtn = document.getElementById('speakBtn');
        const textInput = document.getElementById('text');
        const voiceSelect = document.getElementById('voice');
        const apikeyInput = document.getElementById('apikey');
        const statusDiv = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');

        function showStatus(msg, isError = false) {
            statusDiv.textContent = msg;
            statusDiv.className = 'status ' + (isError ? 'error' : 'success');
        }

        async function synthesize() {
            const text = textInput.value.trim();
            if (!text) {
                showStatus('❌ 请输入文字', true);
                return;
            }

            const voice = voiceSelect.value;
            const apiKey = apikeyInput.value.trim();

            if (!apiKey) {
                showStatus('❌ 请输入 API Key', true);
                return;
            }

            speakBtn.disabled = true;
            speakBtn.textContent = '⏳ 生成中...';
            showStatus('正在合成语音，请稍候...');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: 'tts-1',
                        input: text,
                        voice: voice,
                    }),
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `HTTP ${response.status}`);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                audioPlayer.src = audioUrl;
                audioPlayer.style.display = 'block';
                audioPlayer.play();
                showStatus('✅ 语音生成成功！');
            } catch (err) {
                showStatus('❌ 失败: ' + err.message, true);
            } finally {
                speakBtn.disabled = false;
                speakBtn.textContent = '🔊 生成并播放';
            }
        }

        speakBtn.addEventListener('click', synthesize);
        textInput.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') synthesize();
        });
    </script>
</body>
</html>
